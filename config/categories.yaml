# Canonical product categories.
# search_de: term typed into German-language store search boxes (Aldi, and Coop once it's back).
# search_en: term used against Migros, whose /en/ site matches English terms far more
#            reliably than German ones (confirmed by testing - "Sojadrink" happened to
#            work, "Äpfel" returned zero results, "Apple" worked).
# keywords_include: raw product name (lowercased) must contain at least one of these to count as a real match.
# keywords_exclude: raw product name must NOT contain any of these (filters out ready-meals, unrelated hits, etc.).
# off_search_term: fallback query against Open Food Facts when a store doesn't expose a barcode.
# unit: "g", "ml", or "roll" - what price-per-unit is normalized to.
# food: whether to run the Open Food Facts health-scoring step at all.
# fresh_produce: whole/unprocessed fruit - skip the OFF lookup and assume a clean
#                NOVA-1, zero-additive, zero-sat-fat profile rather than showing "unrated"
#                (OFF has essentially no barcode/name coverage for loose fresh fruit).

- id: soy_milk
  name: Soy milk
  search_de: Sojadrink
  search_en: Soya Drink
  keywords_include: [sojadrink, "soja drink", "soja-drink", "soya drink", "soya-drink", soymilk, soyamilk, "soy milk", sojamilch]
  keywords_exclude: [joghurt, yogurt, dessert, pudding, sauce, sojaöl, mehl]
  off_search_term: soy milk
  off_category_tags: [soy-milk, soya-milk, plant-based-milk, plant-based-beverages, soy]
  unit: ml
  food: true

