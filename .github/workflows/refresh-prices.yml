# Weekly price refresh, run in the cloud instead of on a laptop.
#
# Starts from the published snapshot, re-fetches every store that works with
# plain HTTP requests, and commits the refreshed snapshot back to main, which
# redeploys the hosted app. Stores that need a real browser are skipped and
# keep their last published prices (see scripts/publish_snapshot.py).
name: Refresh prices

on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Start from the published snapshot
        run: mkdir -p data && cp snapshot/pantry.db data/pantry.db

      - name: Fetch prices
        run: python -m swiss_pantry.pipeline --no-browser

      - name: Publish snapshot
        run: python scripts/publish_snapshot.py

      - name: Commit if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/pantry.db
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh prices ($(date -u +%Y-%m-%d))"
            git push
          fi
